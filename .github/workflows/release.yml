name: Release — build all boards + inst package

# Builds EVERY board object for both IRIX releases inside the IRIS emulator,
# packages each OS into an inst tardist (Software Manager installable), and
# publishes a GitHub release. Manually triggerable (workflow_dispatch) and on a
# v* tag push.
#
# CONFIG (Settings > Secrets and variables > Actions):
#   Secrets:
#     IRIX53_DISK_URL   download URL for the 5.3 boot .chd (blank root pw)
#     IRIX65_DISK_URL   download URL for the 6.5 boot .chd (blank root pw)
#   Both must be dev disks with the IDO dev option (cc, /var/sysgen, gendist) -
#   the same disks that build the driver already carry gendist, so the inst
#   tardist is produced with no extra CD.
#   Variables (optional):
#     IRIS_VARIANT_53 / IRIS_VARIANT_65   iris CPU build per leg [r4400 covers
#                       both; set r5000 only for an R5000-installed disk].

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (blank = UTC date stamp)"
        required: false
        default: ""
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = tag ]; then v="${GITHUB_REF_NAME#v}"
          else v="$(date -u +%Y-%m-%d-%H-%M)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice::release version $v"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        release: ["5.3", "6.5"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      IRIX53_DISK_URL: ${{ secrets.IRIX53_DISK_URL }}
      IRIX65_DISK_URL: ${{ secrets.IRIX65_DISK_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Runner deps
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Fetch prebuilt iris + iris-ci
        env:
          IRIS_VARIANT: ${{ matrix.release == '5.3' && (vars.IRIS_VARIANT_53 || 'r4400') || (vars.IRIS_VARIANT_65 || 'r4400') }}
        run: |
          mkdir -p iris/target/release
          gh release download --repo danifunker/iris \
            --pattern "IRIS-cli-${IRIS_VARIANT}-linux-x64-*.tar.gz" --dir iris --clobber
          tar xzf iris/IRIS-cli-*-linux-x64-*.tar.gz -C iris
          for b in iris iris-ci; do f=$(find iris -name "$b" -type f | head -1); [ -n "$f" ] && cp "$f" "iris/target/release/$b"; done
          chmod +x iris/target/release/iris iris/target/release/iris-ci

      - name: Fetch rb-cli
        run: |
          mkdir -p .rb-cli-bin
          gh release download --repo danifunker/rusty-backup --pattern 'rb-cli-linux-x64-*.tar.gz' --dir .rb-cli-bin --clobber
          tar -C .rb-cli-bin -xzf .rb-cli-bin/rb-cli-linux-x64-*.tar.gz
          chmod +x .rb-cli-bin/rb-cli
          echo "$PWD/.rb-cli-bin" >> "$GITHUB_PATH"

      - name: Fetch ${{ matrix.release }} boot disk
        id: img
        run: echo "path=$(shared/scripts/fetch-image.sh --release ${{ matrix.release }} --dest guest-${{ matrix.release }}.chd)" >> "$GITHUB_OUTPUT"

      - name: Build all boards + inst tardist (${{ matrix.release }})
        run: |
          shared/scripts/iris-release.sh --release ${{ matrix.release }} \
            --version "${{ needs.version.outputs.version }}" \
            --image "${{ steps.img.outputs.path }}" \
            --iris-dir "$PWD/iris" \
            --outdir "$PWD/out"
          echo "=== artifacts ==="; ls -l out/

      - name: Upload ${{ matrix.release }} artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dp-${{ matrix.release }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dp-*
          merge-multiple: true
          path: dist
      - name: List + publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.version.outputs.version }}"
          echo "=== release artifacts ==="; ls -l dist/
          gh release create "v$V" --repo "${{ github.repository }}" \
            --title "DaynaPort driver v$V" \
            --notes "All-board IRIX 5.3 (o32) and 6.5 (n32/64) driver objects, and inst tardists (Software Manager installable). See irix5.3/ and irix6.5/ READMEs to install." \
            dist/* || gh release upload "v$V" --repo "${{ github.repository }}" dist/* --clobber
